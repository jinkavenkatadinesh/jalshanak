[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "venv",
    ".venv",
    "node_modules",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # Module level import not at top of file (needed for our bcrypt patches)
    "E501",  # Line too long (since some logs and comments are long)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = false
exclude = "venv|node_modules"
disable_error_code = ["assignment", "union-attr", "arg-type", "call-overload", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
