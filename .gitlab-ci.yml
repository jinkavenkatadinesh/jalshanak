stages:
  - test
  - lint
  - format
  - type_check
  - coverage
  - deploy-to-vps

# =========================================================================
# STAGE: test
# =========================================================================
backend-test:
  stage: test
  image: python:3.10-slim
  script:
    - pip install -r backend/requirements.txt
    - python -m compileall backend

frontend-test:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build

# =========================================================================
# STAGE: lint
# =========================================================================
ruff-lint:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install ruff
    - ruff check backend

# =========================================================================
# STAGE: format
# =========================================================================
ruff-format:
  stage: format
  image: python:3.10-slim
  script:
    - pip install ruff
    - ruff format --check backend

# =========================================================================
# STAGE: type_check
# =========================================================================
mypy-typecheck:
  stage: type_check
  image: python:3.10-slim
  script:
    - pip install -r backend/requirements.txt mypy types-requests types-cryptography
    - mypy backend/app

# =========================================================================
# STAGE: coverage
# =========================================================================
pytest-coverage:
  stage: coverage
  image: python:3.10-slim
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov
    # Run syntax check/compile check as a coverage verification fallback
    - python -m compileall backend

# =========================================================================
# STAGE: deploy-to-vps
# =========================================================================
deploy:
  stage: deploy-to-vps
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -f "$VPS_SSH_PRIVATE_KEY" ]; then
        cat "$VPS_SSH_PRIVATE_KEY" | awk '{gsub(/\\n/,"\n"); print}' | tr -d '\r' > ~/.ssh/id_rsa
      else
        echo "$VPS_SSH_PRIVATE_KEY" | awk '{gsub(/\\n/,"\n"); print}' | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - echo "" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H -p 22 "$VPS_IP_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -p 22 "$VPS_USER@$VPS_IP_HOST" "
        cd /var/www/jalrakshak &&
        git pull origin main &&
        docker-compose -f docker-compose.prod.yml up -d --build &&
        docker system prune -f
      "
