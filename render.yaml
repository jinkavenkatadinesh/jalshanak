databases:
  - name: jalrakshak-db
    plan: free

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: jalrakshak-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jalrakshak-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # 2. React (Vite) Frontend Static Site
  - type: web
    name: jalrakshak-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://jalrakshak-backend.onrender.com/api
        sync: false
