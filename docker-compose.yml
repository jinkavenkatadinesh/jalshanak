version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: jalrakshak_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: jalrakshak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Backend Application
  backend:
    build: ./backend
    container_name: jalrakshak_backend_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/jalrakshak_db
      - SECRET_KEY=b4f8d9c228a6d47b1983fbe2e92cbb32e3612845c478aef9f3a9e3d93bfb1234
      - UPLOAD_DIR=uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

  # 3. Nginx Served React Frontend Application
  frontend:
    build: ./frontend
    container_name: jalrakshak_frontend_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
